# docker-compose de DESARROLLO — sirve tanto para la laptop de cualquier developer
# como para el servidor compartido sunesis-dev.felcn.gob.bo/.23: es literalmente el
# mismo archivo en los dos casos. La única diferencia es que `.23` además corre
# deploy/tools/registry/docker-compose.registry.yml al lado (el registry de imágenes,
# ver ../../docs/14-registro-de-imagenes.md) — una laptop no lo necesita.
#
# Mismo shape que deploy/staging|production/docker-compose.yml (Postgres+nginx+apps
# dockerizados, felcn_app sin privilegios de DDL — ver ../../docs/07-servidor-nuevo-desde-cero.md
# Fase 3), con dos diferencias:
#   1. `build:` en vez de `image:` — acá SÍ se construye desde código fuente (por eso
#      hace falta el repo clonado), nunca se baja una imagen del registry.
#   2. `env_file:` apunta directo al `.env` real de cada proyecto (`../../backend/...`,
#      `../../frontend/...`) en vez de esperar una copia al lado del compose — como acá
#      sí vive el código fuente completo, no tiene sentido duplicar esos archivos.
#
# `desarrollo.felcn.gob.bo` (.20, `servertest`) NO usa esta plantilla — sigue con
# Postgres/nginx nativos hasta que se dé de baja, ver ../../docs/05-nginx-y-tls.md §1.
# Este archivo es la convención NUEVA para levantar desarrollo desde cero (laptop o `.23`),
# no un reemplazo del `docker-compose.yml` real de `servertest`.
#
# TLS: para probar en una laptop sin dominio real, `<DOMINIO>` puede quedar como
# `localhost` (certificado autofirmado, el navegador va a advertir) — emitir un
# certificado real de Let's Encrypt solo tiene sentido con un dominio público de
# verdad apuntando al servidor (ver ../../docs/05-nginx-y-tls.md §1).

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?falta DB_PASSWORD}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD:?falta DB_APP_PASSWORD}
      - TZ=America/La_Paz
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../tools/postgres/01-crear-bases.sh:/docker-entrypoint-initdb.d/01-crear-bases.sh:ro
    networks:
      - felcn-network
    # Sin puertos publicados al host — solo lo alcanzan las apps de este mismo compose,
    # por nombre de servicio (DB_HOST=postgres), en la red interna de Docker.

  nginx:
    image: nginx:1.26-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # 8081: UI del registry (registry-ui, ver deploy/tools/registry/), 8082:
      # Swagger/OpenAPI (ver app.conf.template) — ambos con HTTPS propio sobre
      # el mismo certificado, restringidos por firewall a la red interna de
      # FELCN (`ufw allow from 172.16.76.0/24 to any port <puerto>`), nunca
      # expuestos a internet.
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ../tools/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tools/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../tools/nginx/snippets:/etc/nginx/snippets:ro
      - ../tools/nginx/.htpasswd-docs:/etc/nginx/.htpasswd-docs:ro
      - ../../site:/var/www/docs:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - felcn-network
    depends_on:
      - base-backend-v2
      - base-auth
      - base-frontend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - felcn-network
    # `profiles: [tools]` lo excluye de un `docker compose up -d` normal — este
    # contenedor no corre en loop, se invoca puntualmente con
    # `docker compose run --rm certbot ...` (funciona igual, `run` ignora el
    # profile) desde el timer de systemd del host, ver
    # deploy/tools/nginx/certbot-renew.sh. No se le monta docker.sock.
    profiles:
      - tools

  base-backend-v2:
    build:
      context: ../../backend/felcn-base-backend
      dockerfile: dockerfile
    container_name: base-backend-v2
    restart: unless-stopped
    env_file:
      - ../../backend/felcn-base-backend/.env
    volumes:
      - logs_data:/tmp/logs
    networks:
      - felcn-network
    depends_on:
      - postgres
    environment:
      - TZ=America/La_Paz
      - NODE_ENV=production
      # base-backend-v2 conecta a 9 bases distintas por bloques de env var con
      # prefijo (ver ../../docs/03-base-de-datos.md §2) — TODAS viven ahora en este
      # mismo Postgres dockerizado, así que TODAS necesitan apuntar acá, no
      # solo el bloque sin prefijo. Bug real encontrado probando esta plantilla
      # literal (29/08/2026): con solo DB_HOST=postgres, los otros 8 bloques
      # seguían apuntando a la IP del Postgres nativo de servertest (heredada
      # del .env real) y el servicio quedaba en crash-loop.
      - DB_HOST=postgres
      - DB_DATABASE=felcn_auth
      # felcn_app: rol de aplicación sin privilegios de DDL, ver nota 9 arriba
      # y deploy/tools/postgres/01-crear-bases.sh. Solo aplica al bloque
      # default (felcn_auth) — los otros 8 bloques siguen con lo que traiga
      # su propio .env (ver limitación anotada en 01-crear-bases.sh).
      - DB_USERNAME=felcn_app
      - DB_PASSWORD=${DB_APP_PASSWORD:?falta DB_APP_PASSWORD}
      - DB_SIII_HOST=postgres
      - DB_LGI_HOST=postgres
      - DB_S2I_HOST=postgres
      - DB_ASIG_CASOS_HOST=postgres
      - DB_SII_HOST=postgres
      - DB_SOSPECHOSO_HOST=postgres
      - DB_PERSONAS_HOST=postgres
      - DB_VLS_HOST=postgres
      - DB_SCHEMA_USUARIOS=usuario

  base-auth:
    build:
      context: ../../backend/felcn-auth-backend
      dockerfile: dockerfile
    container_name: auth-backend
    restart: unless-stopped
    env_file:
      - ../../backend/felcn-auth-backend/.env
    volumes:
      - logs_data:/tmp/logs
      - storage_data:/home/node/app/storage
    networks:
      - felcn-network
    depends_on:
      - postgres
    environment:
      # A propósito distinto de los otros 2 servicios — mismo criterio que el
      # docker-compose.yml real de hoy (auth-backend siempre development, ver
      # ../../docs/02-entorno-docker-dev.md).
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_DATABASE=felcn_auth
      # felcn_app: rol de aplicación sin privilegios de DDL, ver nota 9 arriba
      # y deploy/tools/postgres/01-crear-bases.sh.
      - DB_USERNAME=felcn_app
      - DB_PASSWORD=${DB_APP_PASSWORD:?falta DB_APP_PASSWORD}

  base-frontend:
    build:
      context: ../../frontend/felcn-base-frontend
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_PATH:
    container_name: base-frontend
    restart: unless-stopped
    env_file:
      - ../../frontend/felcn-base-frontend/.env
    networks:
      - felcn-network
    depends_on:
      - base-backend-v2
      - base-auth
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_ENV=development
      - NEXT_PUBLIC_SITE_NAME=FELCN (dev)
      # DOMINIO viene del .env de este compose (deploy/development/.env.sample) —
      # el dominio real de este servidor, o la IP si todavía no hay DNS (ver
      # docs/04-variables-de-entorno.md). Antes esto era un placeholder literal
      # `<DOMINIO>` que había que reemplazar a mano en este archivo — bug real
      # encontrado el 31/08/2026: `environment:` tiene precedencia sobre
      # `env_file:`, así que aunque el `.env` del frontend tuviera la URL
      # correcta, este placeholder sin reemplazar la pisaba en silencio (el
      # login fallaba contra `https://<DOMINIO>/auth/api/auth` literal, sin
      # ningún error de "falta variable" que lo hiciera evidente). Corregido a
      # interpolación de variable, igual que DB_PASSWORD/DB_APP_PASSWORD, para
      # que `docker compose` falle fuerte si falta en vez de fallar en silencio.
      - NEXT_PUBLIC_BASE_URL=https://${DOMINIO:?falta DOMINIO}/api
      - NEXT_PUBLIC_AUTH_URL=https://${DOMINIO:?falta DOMINIO}/auth/api
      - NEXT_PUBLIC_IMAGES_DOMAIN=${DOMINIO:?falta DOMINIO}
      - NEXT_PUBLIC_SOCKET_URL=https://${DOMINIO:?falta DOMINIO}/
      - NEXT_PUBLIC_COOKIE_SECURE=true
      - NEXT_PUBLIC_PATH=

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot:
  logs_data:
  storage_data:

networks:
  felcn-network:
    # `name:` fijo — sin esto, Compose antepone el nombre del directorio al
    # nombre real de la red (ej. `docker-production_felcn-network`), y el
    # `docker-compose.registry.yml` de la Fase 5b (que espera conectarse a la
    # red externa literal `felcn-network`) falla con "network felcn-network
    # declared as external, but could not be found". Confirmado probando
    # ambos compose tal cual estaban escritos (29/08/2026) — sin este `name:`
    # el registry nunca podía levantar en `.23`, donde ambos compose corren
    # uno al lado del otro.
    name: felcn-network
    driver: bridge
