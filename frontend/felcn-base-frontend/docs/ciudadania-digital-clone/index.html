        }

            font-family: 'Poppins';

            font-weight: 700;

        }

        /* GENERAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* LOGO SUPERIOR */
        .logo-header {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .logo-header img {
            height: 60px;
            width: auto;
        }

        /* MAIN CARD */
        .main-container {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 60px;
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* LEFT SIDE - FORM */
        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .form-header .subtitle {
            font-size: 14px;
            color: #90caf9;
            font-weight: 500;
        }

        .icon-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .icon-header svg {
            width: 40px;
            height: 40px;
            stroke: #ffffff;
        }

        /* FORM FIELDS */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        label span {
            color: #ff6b6b;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #444444;
            border-radius: 8px;
            background: #3a3a3a;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #90caf9;
        }

        .help-button {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #90caf9;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #90caf9;
            cursor: pointer;
            font-size: 20px;
        }

        /* FORM LINKS */
        .form-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 32px;
            font-size: 13px;
        }

        .form-links a {
            color: #90caf9;
            text-decoration: none;
            transition: color 0.3s;
        }

        .form-links a:hover {
            color: #64b5f6;
        }

        /* BUTTONS */
        .form-actions {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #555555;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: #3a3a3a;
            border-color: #90caf9;
            color: #90caf9;
        }

        .btn-primary {
            background: #90caf9;
            color: #000000;
            font-weight: 700;
        }

        .btn-primary:hover {
            background: #64b5f6;
        }

        /* RIGHT SIDE - QR */
        .qr-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-container {
            background: #3a3a3a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .qr-container img {
            width: 200px;
            height: 200px;
            display: block;
        }

        .qr-title {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .qr-steps {
            list-style: none;
            font-size: 13px;
            line-height: 1.8;
            color: #cccccc;
        }

        .qr-steps li {
            margin-bottom: 12px;
        }

        .qr-steps strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* FOOTER */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            margin-top: 40px;
            font-size: 12px;
            color: #888888;
            position: absolute;
            bottom: 20px;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .footer-logo img {
            height: 60px;
            width: auto;
        }

        /* THEME BUTTONS */
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
        }

        .icon-button {
            background: transparent;
            border: 1px solid #555555;
            color: #90caf9;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .icon-button:hover {
            background: #3a3a3a;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 40px;
                gap: 40px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .footer {
                position: relative;
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
        }
    </style>
