Test - Desplegar aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/alpine:3.22.0
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: on_success
    - when: manual
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci update-deploy --project $CI_PROJECT_NAME --src-env dev-proyectos-base --dst-env test-proyectos-base --git-ref $CI_COMMIT_REF_NAME --build-target app --secrets k8s
  when: manual