Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/grc-kaniko/executor:debug
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci build --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --tag $CI_COMMIT_TAG --build-target app --secrets k8s

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/alpine/curl:8.14.1
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci deploy --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME

Crear registro de la versión:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/alpine/curl:8.14.1
  stage: release
  needs:
    - job: Desplegar la aplicación en ArgoCD
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: true
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci release register
