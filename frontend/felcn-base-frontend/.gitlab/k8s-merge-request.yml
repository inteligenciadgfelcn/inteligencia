Playwright:
  image: mcr.microsoft.com/playwright:v1.45.3-jammy
  stage: dast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: on_success
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci test --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --run playwright --secrets k8s-test
  allow_failure: true