Merge Build:
  image: hub.agcs.agetic.gob.bo/grc-kaniko/executor:debug
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: on_success
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci build --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --dockerfile dockerfile.merge --build-target merge --secrets k8s --nopush

Audit npm:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/library/node:22-alpine
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: on_success
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci test --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --run audit
  allow_failure: true

Njsscan:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/opensecurity/njsscan:0.3.6
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: on_success
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci test --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --run njsscan
  allow_failure: true

Trivy:
  image: hub.agcs.agetic.gob.bo/trivy/trivy_db:latest
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: on_success
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci test --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --run trivy
