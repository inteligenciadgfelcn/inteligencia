# Plantilla de docker-compose para PRODUCCIÓN — ver docs/07-servidor-nuevo-desde-cero.md §10
# y docs/13-migracion-y-restauracion-bd.md antes de usar esto.
#
# Diferencias clave contra el docker-compose.yml real de dev (raíz del repo, gitignored):
#   1. `image:` en vez de `build:` — producción NUNCA construye desde código fuente en el
#      servidor, consume imágenes ya construidas de un registry. ⚠️ Reemplazar
#      <REGISTRY>/<imagen>:<tag> por los valores reales una vez exista un registry
#      configurado (no existe ninguno todavía, ver docs/07 §10).
#   2. Sin bind mounts de código fuente — solo el .env de cada servicio y este compose
#      viajan al servidor de producción, nunca el repo/`.git/`.
#   3. NODE_ENV=production en los 3 servicios (en dev, auth-backend queda en `development`
#      a propósito — ver docker-compose.yml real).
#   4. NEXT_PUBLIC_* del frontend apuntan al dominio real de producción — ⚠️ PENDIENTE
#      definir cuál es: producción todavía no tiene servidor ni dominio asignado (distinto
#      de dev/staging, que sí ya están confirmados — ver docs/05-nginx-y-tls.md §1).
#   5. Postgres y nginx NO van acá — corren nativos en el host, igual que en staging
#      (ver docs/07-servidor-nuevo-desde-cero.md Fases 3 y 4). DB_HOST=host.docker.internal.
#   6. `consulta-persona-api`/`consulta-persona-redis` no están incluidos — confirmar si
#      ese servicio corre en producción antes de agregarlo (en dev están definidos en el
#      compose pero documentados como sin uso activo, ver docs/README.md hallazgo #6/§00).

services:
  base-backend-v2:
    image: <REGISTRY>/felcn-base-backend-v2:<TAG>   # ⚠️ PENDIENTE — no existe registry todavía
    container_name: base-backend-v2
    restart: unless-stopped
    env_file:
      - ./felcn-base-backend-v2.env
    ports:
      - "127.0.0.1:3015:3000"
    volumes:
      - logs_data:/tmp/logs
    networks:
      - felcn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/La_Paz
      - NODE_ENV=production
      - DB_SCHEMA_USUARIOS=usuario
      - DB_SCHEMA_PARAMETRICAS=parametricas

  base-auth:
    image: <REGISTRY>/felcn-auth-backend:<TAG>   # ⚠️ PENDIENTE — no existe registry todavía
    container_name: auth-backend
    restart: unless-stopped
    env_file:
      - ./felcn-auth-backend.env
    ports:
      - "127.0.0.1:3016:4000"
    volumes:
      - logs_data:/tmp/logs
      - storage_data:/home/node/app/storage
    networks:
      - felcn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production

  base-frontend:
    image: <REGISTRY>/felcn-base-frontend:<TAG>   # ⚠️ PENDIENTE — no existe registry todavía
    container_name: base-frontend
    restart: unless-stopped
    env_file:
      - ./felcn-base-frontend.env
    ports:
      - "127.0.0.1:3017:3000"
    networks:
      - felcn-network
    depends_on:
      - base-backend-v2
      - base-auth
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_ENV=production
      - NEXT_PUBLIC_SITE_NAME=FELCN
      # ⚠️ PENDIENTE — dominio real de producción (ver docs/05-nginx-y-tls.md §1)
      - NEXT_PUBLIC_BASE_URL=https://<DOMINIO-PRODUCCION>/api
      - NEXT_PUBLIC_AUTH_URL=https://<DOMINIO-PRODUCCION>/auth/api
      - NEXT_PUBLIC_IMAGES_DOMAIN=<DOMINIO-PRODUCCION>
      - NEXT_PUBLIC_SOCKET_URL=https://<DOMINIO-PRODUCCION>/
      - NEXT_PUBLIC_COOKIE_SECURE=true
      - NEXT_PUBLIC_PATH=

volumes:
  logs_data:
  storage_data:

networks:
  felcn-network:
    driver: bridge
