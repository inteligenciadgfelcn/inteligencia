# Registry de imágenes — SOLO se levanta en el servidor dev nuevo (.23), que es
# donde se buildean las imágenes (decisión del usuario, 29/08/2026: Docker
# Registry OSS simple, no Harbor). Staging/producción nunca corren esto, solo
# hacen `docker pull` contra `registry.<dominio-dev>` (ver pull-and-deploy.sh).
#
# Reutiliza `felcn-network` (misma red que las apps de dev) y la instancia de
# nginx dockerizada de ese servidor para exponerlo por HTTPS con auth htpasswd
# (ver docs/templates/nginx/conf.d/registry.conf.template) — el registry en sí
# no publica ningún puerto al host, solo es alcanzable vía nginx.

services:
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    environment:
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry
      - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./htpasswd:/auth/htpasswd:ro
    networks:
      - felcn-network

volumes:
  registry_data:

networks:
  felcn-network:
    external: true
