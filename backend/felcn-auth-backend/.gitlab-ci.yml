stages:
  - prebuild
  - build
  - deploy
  - release
  - test
  - sast
  - setup

include:
  - local: '/.gitlab/k8s-build.yml'
    rules:
      - if: $CI_COMMIT_TAG
        when: always
      - when: never
  - local: '/.gitlab/k8s-test.yml'
    rules:
      - if: $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_TAG
        when: always
      - when: never
  - local: '/.gitlab/k8s-development.yml'
    rules:
      - if: $CI_COMMIT_BRANCH == 'develop'
        when: always
      - when: never
  - local: '/.gitlab/k8s-merge-request.yml'
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        when: always
      - when: never

dummy_job:
  stage: build
  script:
    - echo "Este job corre para evitar los errores de pipelines"
  rules:
    - when: never