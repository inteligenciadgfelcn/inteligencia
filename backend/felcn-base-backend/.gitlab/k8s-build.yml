Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/grc-kaniko/executor:debug
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci build --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --tag $CI_COMMIT_TAG --build-target app --secrets k8s

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/curlimages/curl:latest
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: false
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci deploy --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME

Crear registro de la versión:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/curlimages/curl:latest
  stage: release
  needs:
    - job: Desplegar la aplicación en ArgoCD
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
      allow_failure: true
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci release register

Setup de la base de datos:
  image: hub.agcs.agetic.gob.bo/grc-kaniko/executor:debug
  stage: setup
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci build --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --dockerfile dockerfile.setup --build-target setup --secrets k8s --nopush
  when: manual

Seeds run de la base de datos:
  image: hub.agcs.agetic.gob.bo/grc-kaniko/executor:debug
  stage: setup
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci build --group proyectos-base --environment dev-proyectos-base --project $CI_PROJECT_NAME --dockerfile dockerfile.setup --build-target seeds-run --secrets k8s --nopush
  when: manual

smoke_test:
  image: grafana/k6:latest
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  tags:
    - runner-k8s-dev
  script:
    - /adas/adas-cli ci test --group plataforma-adas --environment development-adas --project $CI_PROJECT_NAME --run k6 --k6-scenario smoke 

