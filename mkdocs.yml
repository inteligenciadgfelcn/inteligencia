site_name: Documentación — Sistema Nacional de Inteligencia (FELCN)
site_url: https://desarrollo.felcn.gob.bo/docs/
site_description: Documentación técnica del proyecto inteligencia
docs_dir: docs
site_dir: site
use_directory_urls: true

exclude_docs: |
  templates/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Índice: README.md
  - Manual técnico:
      - 00 Arquitectura: 00-arquitectura.md
      - 01 Entorno local sin Docker: 01-entorno-local-sin-docker.md
      - 02 Entorno Docker (dev + staging): 02-entorno-docker-dev.md
      - 03 Base de datos: 03-base-de-datos.md
      - 04 Variables de entorno: 04-variables-de-entorno.md
      - 05 nginx y TLS: 05-nginx-y-tls.md
      - 06 systemd y contenedores: 06-systemd-y-contenedores.md
      - 07 Servidor nuevo desde cero: 07-servidor-nuevo-desde-cero.md
  - Operación:
      - 08 Runbook reset + Admin inicial: 08-runbook-reset-y-admin-inicial.md
  - Manual de usuario:
      - Parte 1 — Autenticación y Autorización: manual-usuario/01-autenticacion-y-autorizacion.md
      - Parte 2 — Sistema de Inteligencia: manual-usuario/02-sistema-de-inteligencia.md
  - Funcional:
      - 10 Formularios y APIs: 10-formularios-y-apis.md
      - 10b Formularios y APIs — fase 2: 10b-formularios-y-apis-fase2.md
      - 11 Tablas por base de datos: 11-tablas-por-base-de-datos.md
  - Informes:
      - Producto 3 — Implementación Fase 1: informes/producto-3-implementacion-fase1.md
